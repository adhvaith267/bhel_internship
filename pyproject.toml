[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhel-internship"
version = "2.0.0"
description = "Enterprise RAG Engine - local, privacy-preserving Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "rich>=13.8.0",
    "PyMuPDF>=1.24.0",
    "torch>=2.4.0",
    "sentence-transformers>=3.0.0",
    "faiss-gpu-cu12>=1.8.0",
    "rank-bm25>=0.2.2",
    "llama-cpp-python>=0.2.80",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]
optional-dependencies = { dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
] }

[project.scripts]
bhel-internship = "bhel_internship.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bhel_internship*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201"]
exclude = [".venv", "venv", ".rag_cache", "models", "docs", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv", ".venv", ".rag_cache", "models", "docs"]