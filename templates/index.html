<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuRAG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315a37e'/%3E%3Cpath d='M10 22V10l12 12V10' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="/static/js/marked.min.js"></script>
    <script>
        if (typeof marked === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>');
        }
    </script>

    <style>
        :root {
            --bg: #0e1013;
            --sidebar: #14171b;
            --sidebar-hover: #1d2127;
            --panel: #171b20;
            --card: #1a1f25;
            --border: rgba(255, 255, 255, 0.08);
            --border-soft: rgba(255, 255, 255, 0.05);
            --text: #e8eaed;
            --text-dim: #9aa0a6;
            --text-faint: #5f6368;
            --accent: #15a37e;
            --accent-soft: rgba(21, 163, 126, 0.12);
            --amber: #e8a33d;
            --amber-soft: rgba(232, 163, 61, 0.1);
            --red: #e57373;
            --user-bubble: #23282f;
            --radius: 14px;
            --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            font-size: 14.5px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        #app { display: flex; height: 100vh; }

        /* ── Sidebar ─────────────────────────────── */
        #sidebar {
            width: 264px;
            flex-shrink: 0;
            background: var(--sidebar);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.22s ease;
            z-index: 30;
        }
        #app.side-hidden #sidebar { margin-left: -264px; }

        .side-top { padding: 14px 12px 8px; }
        .new-chat-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font: 500 13.5px var(--font);
            cursor: pointer;
            transition: background 0.15s;
        }
        .new-chat-btn:hover { background: var(--sidebar-hover); }

        .search-box { padding: 8px 12px 4px; position: relative; }
        .search-box svg { position: absolute; left: 23px; top: 50%; transform: translateY(-38%); color: var(--text-faint); }
        #chatSearch {
            width: 100%;
            padding: 8px 10px 8px 32px;
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: 9px;
            color: var(--text);
            font: 13px var(--font);
            outline: none;
        }
        #chatSearch:focus { border-color: rgba(21, 163, 126, 0.5); }
        #chatSearch::placeholder { color: var(--text-faint); }

        .side-label {
            padding: 12px 12px 6px 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-faint);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .side-label-right { display: inline-flex; align-items: center; gap: 6px; }
        .side-label-right #chatCount { line-height: 1; }
        .icon-btn.mini { padding: 4px; display: inline-flex; align-items: center; justify-content: center; }

        #chatList { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
        .chat-item {
            padding: 9px 10px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 2px;
            position: relative;
        }
        .chat-item:hover { background: var(--sidebar-hover); }
        .chat-item.active { background: var(--sidebar-hover); }
        .chat-item .t {
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .chat-item .t > span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }
        .chat-item .t .pin-mark { color: var(--accent); flex-shrink: 0; display: inline-flex; }
        .chat-item .d { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
        .dots-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }
        .chat-item:hover .dots-btn { display: inline-flex; }
        #chatMenu {
            display: none;
            position: fixed;
            z-index: 200;
            min-width: 148px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #chatMenu button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            background: transparent;
            border: none;
            color: var(--text);
            font: 500 13px var(--font);
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
            text-align: left;
        }
        #chatMenu button:hover { background: var(--sidebar-hover); }
        #chatMenu button.danger { color: var(--red); }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            display: inline-flex;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .chat-item .rename-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 6px;
            color: var(--text);
            font: 13.5px var(--font);
            padding: 4px 6px;
            outline: none;
        }
        .empty-note { padding: 18px 14px; color: var(--text-faint); font-size: 13px; text-align: center; }

        #scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 20;
        }

        /* ── Main ────────────────────────────────── */
        main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        #topbar {
            height: 56px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border-soft);
        }
        .top-spacer { flex: 1; }

        #docSelect {
            background: var(--card);
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 9px;
            font: 500 12.5px var(--font);
            padding: 7px 9px;
            max-width: 210px;
            outline: none;
            cursor: pointer;
        }

        /* ── Chat column ─────────────────────────── */
        #viewport { flex: 1; overflow-y: auto; }
        #stream { max-width: 780px; margin: 0 auto; padding: 28px 22px 18px; }

        .hero { text-align: center; padding: 11vh 0 0; }
        .hero h1.pixel-rainbow {
            font-family: 'Press Start 2P', monospace;
            font-size: 46px;
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1.8;
            background: linear-gradient(90deg, #ff004c, #ff8a00, #ffee00, #00e676, #00b0ff, #d500f9, #ff004c);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            animation: rainbowSlide 7s linear infinite;
            filter: drop-shadow(-2px -2px 0 rgba(255, 255, 255, 0.32)) drop-shadow(3px 3px 0 #020304) drop-shadow(6px 6px 0 #020304) drop-shadow(6px 6px 20px rgba(21, 163, 126, 0.35));
        }
        @keyframes rainbowSlide { to { background-position: 400% 0; } }
        .hero-line { display: block; min-height: 1.7em; }
        .hero-line .hl { opacity: 0; animation: letterIn 0.16s ease-out forwards; }
        @keyframes letterIn { to { opacity: 1; } }
        .hero-cursor {
            display: inline-block;
            width: 0.62em;
            height: 1em;
            background: #fff;
            vertical-align: -0.12em;
            margin-left: 0.12em;
            opacity: 0;
            animation: cursorBlink 1.05s steps(2, start) 1.6s infinite;
        }
        @keyframes cursorBlink { to { visibility: hidden; } }

        /* ── Messages ────────────────────────────── */
        .msg { margin: 20px 0; animation: fadeUp 0.25s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } }
        .msg.user { display: flex; justify-content: flex-end; }
        .user-bubble {
            background: var(--user-bubble);
            border-radius: 18px 18px 5px 18px;
            padding: 10px 16px;
            max-width: 80%;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.assistant { display: flex; gap: 12px; }
        .avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--accent-soft);
            border: 1px solid rgba(21,163,126,0.4);
            color: var(--accent);
            font: 700 14px var(--font);
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }
        .a-body { flex: 1; min-width: 0; }
        .a-text { word-break: break-word; }
        .a-text p { margin: 0 0 10px; }
        .a-text p:last-child { margin-bottom: 2px; }
        .a-text ul, .a-text ol { margin: 0 0 10px 22px; }
        .a-text li { margin: 3px 0; }
        .a-text h1, .a-text h2, .a-text h3, .a-text h4 { margin: 16px 0 8px; font-weight: 650; }
        .a-text code { font: 12.5px var(--mono); background: var(--card); padding: 2px 6px; border-radius: 6px; }
        .a-text pre {
            background: #0a0c0e;
            border: 1px solid var(--border-soft);
            border-radius: 11px;
            padding: 13px 14px;
            overflow-x: auto;
            margin: 10px 0;
            position: relative;
        }
        .a-text pre code { background: none; padding: 0; }
        .copy-code-btn {
            position: absolute; top: 8px; right: 8px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text-dim); border-radius: 7px;
            font: 500 11px var(--font); padding: 4px 9px; cursor: pointer;
        }
        .copy-code-btn:hover { color: var(--text); }
        .a-text table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 13.5px; }
        .a-text th, .a-text td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
        .a-text th { background: var(--card); }
        .a-text blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 10px 0; }

        .typing { display: inline-flex; gap: 5px; padding: 8px 0; }
        .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

        .notice {
            border-radius: 10px;
            padding: 9px 13px;
            font-size: 13px;
            margin: 10px 0 2px;
        }
        .notice.amber { background: var(--amber-soft); border: 1px solid rgba(232,163,61,0.35); color: #f0c684; }
        .notice.green { background: var(--accent-soft); border: 1px solid rgba(21,163,126,0.35); color: #7fd6b5; }

        .sources { margin-top: 12px; border: 1px solid var(--border-soft); border-radius: 11px; overflow: hidden; }
        .sources > summary {
            cursor: pointer;
            padding: 9px 13px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            background: var(--card);
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sources > summary::-webkit-details-marker { display: none; }
        .sources > summary:hover { color: var(--text); }
        .src-count {
            background: var(--accent-soft); color: var(--accent);
            border-radius: 12px; font-size: 11px; padding: 1px 8px;
        }
        .src-item { padding: 10px 13px; border-top: 1px solid var(--border-soft); font-size: 13px; }
        .src-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
        .src-doc { font-weight: 600; }
        .src-page { color: var(--accent); font: 500 12px var(--mono); }
        .src-score { color: var(--text-faint); font: 11.5px var(--mono); margin-left: auto; }
        .src-quote { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; border-left: 2px solid var(--border); padding-left: 9px; }

        .msg-meta {
            display: flex; align-items: center; gap: 6px;
            margin-top: 9px; font-size: 11.5px; color: var(--text-faint);
        }
        .msg-meta .m-btn {
            background: transparent; border: none; color: var(--text-faint);
            cursor: pointer; padding: 4px 6px; border-radius: 6px;
            display: inline-flex; align-items: center; gap: 5px;
            font: 500 11.5px var(--font);
        }
        .msg-meta .m-btn:hover { background: var(--sidebar-hover); color: var(--text); }

        /* ── Composer ────────────────────────────── */
        #composerWrap { padding: 6px 22px 14px; background: linear-gradient(transparent, var(--bg) 32%); }
        #composer {
            max-width: 780px; margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 10px 10px 10px 18px;
            transition: border-color 0.15s;
        }
        #composer:focus-within { border-color: rgba(21,163,126,0.5); }
        #composer textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font: 14.5px/1.55 var(--font);
            max-height: 190px;
        }
        #composer textarea::placeholder { color: var(--text-faint); }
        .composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
        .composer-hint { font-size: 11.5px; color: var(--text-faint); }
        #sendBtn {
            width: 34px; height: 34px; border-radius: 50%;
            border: none; cursor: pointer;
            background: var(--accent); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
        }
        #sendBtn:disabled { background: #2a2f36; color: var(--text-faint); cursor: default; }
        #sendBtn.stop { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
        #sendBtn.stop:disabled { opacity: 0.5; }

        #toast {
            position: fixed;
            bottom: 88px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            padding: 9px 16px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            max-width: 90vw;
        }
        #toast.show { opacity: 1; transform: translateX(-50%); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #2b3138; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        @media (max-width: 820px) {
            #sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform 0.22s ease; margin-left: 0 !important; }
            #app.side-open #sidebar { transform: translateX(0); }
            #app.side-open #scrim { display: block; }
            #docSelect { max-width: 130px; }
            .hero h1.pixel-rainbow { font-size: 23px; }
        }
        @media (min-width: 821px) {
            #menuBtn { display: none; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- ── Sidebar: previous chats ── -->
    <aside id="sidebar">
        <div class="side-top">
            <button class="new-chat-btn" id="newChatBtn" title="New chat (Ctrl+K)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New chat
            </button>
        </div>
        <div class="search-box">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="chatSearch" type="text" placeholder="Search chats" autocomplete="off">
        </div>
        <div class="side-label">
            <span>Previous chats</span>
            <span class="side-label-right"><span id="chatCount">0</span>
                <button class="icon-btn mini" id="clearAllBtn" title="Delete all chats">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </span>
        </div>
        <div id="chatList"></div>
    </aside>
    <div id="scrim"></div>

    <!-- ── Main ── -->
    <main>
        <header id="topbar">
            <button class="icon-btn" id="menuBtn" title="Chats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="top-spacer"></div>
            <select id="docSelect" title="Limit answers to one document">
                <option value="all">All documents</option>
                {% for doc in selected_documents %}
                <option value="{{ doc }}">{{ doc }}</option>
                {% endfor %}
            </select>
        </header>

        <section id="viewport">
            <div id="stream">
                <div class="hero" id="welcomeHero">
                    <h1 class="pixel-rainbow" id="heroTitle" aria-label="Hello, let's start">
                        {% set ns = namespace(d=350) %}
                        <span class="hero-line">{% for ch in "HELLO" %}<span class="hl" style="animation-delay:{{ ns.d }}ms">{{ ch }}</span>{% set ns.d = ns.d + 60 %}{% endfor %}</span>
                        <span class="hero-line">{% for ch in "LET'S START" %}<span class="hl" style="animation-delay:{{ ns.d }}ms">{% if ch == " " %}&nbsp;{% else %}{{ ch }}{% endif %}</span>{% set ns.d = ns.d + 60 %}{% endfor %}<span class="hero-cursor"></span></span>
                    </h1>
                </div>
            </div>
        </section>

        <footer id="composerWrap">
            <div id="composer">
                <textarea id="composerInput" rows="1" placeholder="Ask about your documents…"></textarea>
                <div class="composer-row">
                    <span></span>
                    <button id="sendBtn" title="Send">
                        <svg id="sendIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                </div>
            </div>
        </footer>
    </main>
</div>

<div id="toast"></div>

<script>
(function () {
    "use strict";

    /* ── Element refs ── */
    const $ = (id) => document.getElementById(id);
    const app = $("app"), stream = $("stream"), viewport = $("viewport"),
        input = $("composerInput"), sendBtn = $("sendBtn"), sendIcon = $("sendIcon"),
        chatList = $("chatList"), chatSearch = $("chatSearch"), chatCount = $("chatCount"),
        docSelect = $("docSelect"), toast = $("toast"),
        welcomeHero = $("welcomeHero");

    const CHATS_KEY = "docurag_chats_v1";
    const DOC_KEY = "docurag_docfilter";
    const SEND_SVG = sendIcon.outerHTML;
    const STOP_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

    let chats = [];
    let activeId = null;
    let generating = false;
    let aborter = null;
    let stickBottom = true;

    /* ── Helpers ── */
    function esc(s) {
        return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function md(text) {
        if (typeof marked !== "undefined" && marked.parse) {
            try { return marked.parse(text); } catch (e) { /* fall through */ }
        }
        return esc(text).replace(/\n/g, "<br>");
    }
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 2600);
    }
    function timeAgo(iso) {
        const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (s < 60) return "just now";
        if (s < 3600) return Math.floor(s / 60) + "m ago";
        if (s < 86400) return Math.floor(s / 3600) + "h ago";
        if (s < 86400 * 7) return Math.floor(s / 86400) + "d ago";
        return new Date(iso).toLocaleDateString();
    }
    function scrollBottom(force) {
        if (stickBottom || force) viewport.scrollTop = viewport.scrollHeight;
    }
    viewport.addEventListener("scroll", () => {
        stickBottom = viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight < 90;
    });

    /* Client-side citation check: every [doc, page] marker must exist in sources. */
    function checkCitations(text, sources) {
        const re = /\[([^,\[\]]+?),\s*[Pp]age\s*(\d+)\]/g;
        const norm = (n) => (n || "").trim().replace(/["']/g, "").toLowerCase().replace(/\.pdf$/, "");
        const evidence = new Set((sources || []).map((s) => norm(s.document) + "|" + s.page));
        let cited = 0, ok = 0, m;
        while ((m = re.exec(text || "")) !== null) {
            cited++;
            if (evidence.has(norm(m[1]) + "|" + parseInt(m[2], 10))) ok++;
        }
        return { cited, ok };
    }

    /* ── Chat store (localStorage) ── */
    function loadChats() {
        try {
            const raw = localStorage.getItem(CHATS_KEY);
            chats = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(chats)) chats = [];
        } catch (e) { chats = []; }
    }
    function saveChats() {
        try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch (e) { /* quota */ }
    }
    function getChat(id) { return chats.find((c) => c.id === id); }

    function renderList() {
        closeMenu();
        const q = (chatSearch.value || "").toLowerCase();
        const items = chats
            .slice()
            .sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) ||
                (new Date(b.updatedAt) - new Date(a.updatedAt)))
            .filter((c) => c.title.toLowerCase().includes(q));
        chatCount.textContent = chats.length;
        chatList.innerHTML = "";
        if (!items.length) {
            chatList.innerHTML = '<div class="empty-note">' + (chats.length ? "No matches." : "No chats yet. Ask something!") + "</div>";
            return;
        }
        const PIN_SVG = '<svg class="pin-mark" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5M9 3h6l1 7 3 3H5l3-3z"/></svg>';
        const DOTS_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
        items.forEach((c) => {
            const el = document.createElement("div");
            el.className = "chat-item" + (c.id === activeId ? " active" : "");
            el.dataset.id = c.id;
            el.innerHTML =
                '<div class="t">' + (c.pinned ? PIN_SVG : "") +
                "<span>" + esc(c.title) + "</span></div>" +
                '<div class="d">' + timeAgo(c.updatedAt) + "</div>" +
                '<button class="icon-btn dots-btn" data-menu="' + c.id + '" title="Options">' + DOTS_SVG + "</button>";
            el.addEventListener("click", (e) => {
                const menuBtn = e.target.closest("[data-menu]");
                if (menuBtn) { e.stopPropagation(); toggleMenu(c.id, menuBtn); return; }
                openChat(c.id);
            });
            chatList.appendChild(el);
        });
    }

    /* ── Per-chat ⋯ menu: Pin / Rename / Delete ── */
    const chatMenu = document.createElement("div");
    chatMenu.id = "chatMenu";
    document.body.appendChild(chatMenu);
    let menuFor = null;

    function closeMenu() {
        if (chatMenu) chatMenu.style.display = "none";
        menuFor = null;
    }

    function toggleMenu(id, anchorBtn) {
        if (menuFor === id) { closeMenu(); return; }
        const c = getChat(id);
        if (!c) return;
        menuFor = id;
        chatMenu.innerHTML =
            '<button data-mact="pin">' + (c.pinned ? "Unpin chat" : "Pin chat") + "</button>" +
            '<button data-mact="rename">Rename</button>' +
            '<button data-mact="del" class="danger">Delete</button>';
        chatMenu.querySelectorAll("button").forEach((b) => {
            b.addEventListener("click", (e) => {
                e.stopPropagation();
                const act = b.dataset.mact;
                closeMenu();
                if (act === "pin") togglePin(id);
                else if (act === "rename") renameChat(id);
                else if (act === "del") deleteChat(id);
            });
        });
        chatMenu.style.display = "block";
        const r = anchorBtn.getBoundingClientRect();
        const mw = 160, mh = 130;
        chatMenu.style.left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8)) + "px";
        chatMenu.style.top = (r.bottom + mh + 8 > window.innerHeight ? r.top - mh - 4 : r.bottom + 4) + "px";
    }

    document.addEventListener("click", (e) => {
        if (!e.target.closest("#chatMenu")) closeMenu();
    });

    function togglePin(id) {
        const c = getChat(id);
        if (!c) return;
        c.pinned = !c.pinned;
        saveChats();
        renderList();
        showToast(c.pinned ? "Chat pinned" : "Chat unpinned");
    }

    function renameChat(id) {
        const c = getChat(id);
        if (!c) return;
        const el = chatList.querySelector('[data-id="' + id + '"] .t');
        if (!el) return;
        const titleEl = el;
        const inp = document.createElement("input");
        inp.className = "rename-input";
        inp.value = c.title;
        titleEl.replaceWith(inp);
        inp.focus();
        inp.select();
        const commit = (save) => {
            if (save && inp.value.trim()) { c.title = inp.value.trim().slice(0, 80); saveChats(); }
            renderList();
        };
        inp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") commit(true);
            if (e.key === "Escape") commit(false);
            e.stopPropagation();
        });
        inp.addEventListener("blur", () => commit(true));
        inp.addEventListener("click", (e) => e.stopPropagation());
    }

    function openChat(id) {
        const c = getChat(id);
        if (!c) return;
        activeId = id;
        renderStream();
        renderList();
        closeSidebarMobile();
        input.focus();
    }

    function deleteChat(id) {
        chats = chats.filter((c) => c.id !== id);
        saveChats();
        if (activeId === id) { activeId = null; renderStream(); }
        renderList();
        showToast("Chat deleted");
    }

    function newChat() {
        if (generating) stopGeneration();
        activeId = null;
        renderStream();
        renderList();
        closeSidebarMobile();
        input.focus();
    }

    function ensureChat(firstQuestion) {
        if (activeId && getChat(activeId)) return getChat(activeId);
        const c = {
            id: "c_" + Date.now().toString(36),
            title: (firstQuestion || "New chat").slice(0, 44),
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            messages: []
        };
        chats.unshift(c);
        activeId = c.id;
        return c;
    }

    function touchChat(c) {
        c.updatedAt = new Date().toISOString();
        saveChats();
        renderList();
    }

    /* ── Message rendering ── */
    function uid() { return "m" + Math.random().toString(36).slice(2, 10); }

    function renderStream() {
        stream.innerHTML = "";
        const c = activeId && getChat(activeId);
        if (!c || !c.messages.length) {
            stream.appendChild(welcomeHero);
            welcomeHero.style.display = "";
            return;
        }
        welcomeHero.style.display = "none";
        c.messages.forEach((m) => {
            stream.appendChild(m.role === "user" ? userNode(m.content) : assistantNode(m));
        });
        scrollBottom(true);
    }

    function userNode(text) {
        const d = document.createElement("div");
        d.className = "msg user";
        d.innerHTML = '<div class="user-bubble">' + esc(text) + "</div>";
        return d;
    }

    function sourcesHtml(sources) {
        if (!sources || !sources.length) return "";
        const items = sources.map((s, i) =>
            '<div class="src-item"><div class="src-head">' +
            "<span class='src-doc'>#" + (i + 1) + " " + esc(s.document) + "</span>" +
            "<span class='src-page'>p." + s.page + "</span>" +
            (s.is_table ? "<span class='src-page'>table</span>" : "") +
            '<span class="src-score">' + (typeof s.score === "number" ? s.score.toFixed(2) : esc(String(s.score ?? ""))) + "</span>" +
            "</div><div class='src-quote'>" + esc(s.snippet) + "</div></div>"
        ).join("");
        return '<details class="sources"><summary><span class="src-count">' + sources.length +
            "</span>Sources &amp; citations</summary>" + items + "</details>";
    }

    function assistantNode(m) {
        const d = document.createElement("div");
        d.className = "msg assistant";
        const id = uid();
        let notice = "";
        if (m.abstained) {
            notice = '<div class="notice amber">Not enough grounded evidence in the retrieved passages — no answer was generated.</div>';
        } else if (m.cite && m.cite.cited > 0 && m.cite.ok < m.cite.cited) {
            notice = '<div class="notice amber">' + (m.cite.cited - m.cite.ok) + " of " + m.cite.cited +
                " citation(s) could not be matched to the retrieved sources.</div>";
        } else if (m.cite && m.cite.cited > 0) {
            notice = '<div class="notice green">All ' + m.cite.cited + " citation(s) verified against sources.</div>";
        }
        const metaBits = [];
        if (m.model) metaBits.push(esc(m.model));
        if (m.latencyMs) metaBits.push((m.latencyMs / 1000).toFixed(1) + "s");
        if (m.sources && m.sources.length) metaBits.push(m.sources.length + " sources");
        d.innerHTML =
            '<div class="avatar">D</div><div class="a-body">' +
            '<div class="a-text" id="' + id + '">' + md(m.content) + "</div>" +
            notice + sourcesHtml(m.sources) +
            '<div class="msg-meta"><span>' + metaBits.join(" · ") + "</span>" +
            '<button class="m-btn" data-copy="' + id + '">Copy</button>' +
            '<button class="m-btn" data-regen="1">Regenerate</button></div></div>';
        decorateCodeBlocks(d);
        return d;
    }

    function typingNode() {
        const d = document.createElement("div");
        d.className = "msg assistant";
        d.innerHTML = '<div class="avatar">D</div><div class="a-body"><div class="typing"><span></span><span></span><span></span></div></div>';
        return d;
    }

    /* Code-block copy buttons + message actions (delegated). */
    stream.addEventListener("click", (e) => {
        const copyBtn = e.target.closest("[data-copy]");
        if (copyBtn) {
            const el = document.getElementById(copyBtn.dataset.copy);
            if (el) navigator.clipboard.writeText(el.innerText)
                .then(() => showToast("Copied to clipboard"))
                .catch(() => showToast("Copy failed"));
            return;
        }
        if (e.target.closest("[data-regen]")) { regenerate(); return; }
        const codeBtn = e.target.closest("[data-codecopy]");
        if (codeBtn) {
            const pre = codeBtn.parentElement;
            const code = pre.querySelector("code");
            navigator.clipboard.writeText(code ? code.innerText : pre.innerText)
                .then(() => showToast("Code copied"))
                .catch(() => showToast("Copy failed"));
        }
    });

    function decorateCodeBlocks(root) {
        root.querySelectorAll("pre").forEach((pre) => {
            if (pre.querySelector("[data-codecopy]")) return;
            const b = document.createElement("button");
            b.className = "copy-code-btn";
            b.setAttribute("data-codecopy", "1");
            b.textContent = "Copy";
            pre.appendChild(b);
        });
    }

    /* ── Send / stream ── */
    function setGenerating(on) {
        generating = on;
        sendBtn.classList.toggle("stop", on);
        sendBtn.innerHTML = on ? STOP_SVG : SEND_SVG;
        sendBtn.disabled = false;
        sendBtn.title = on ? "Stop" : "Send";
    }

    function stopGeneration() {
        if (aborter) aborter.abort();
    }

    async function sendQuestion(question) {
        question = (question || "").trim();
        if (!question || generating) return;
        const chat = ensureChat(question);
        if (welcomeHero.parentNode === stream) welcomeHero.style.display = "none";

        stream.appendChild(userNode(question));
        chat.messages.push({ role: "user", content: question });
        touchChat(chat);

        input.value = "";
        input.style.height = "auto";

        const typing = typingNode();
        stream.appendChild(typing);
        scrollBottom(true);
        setGenerating(true);
        aborter = new AbortController();
        const t0 = performance.now();

        const docVal = docSelect.value;
        let sources = [];
        let text = "";
        let failed = false;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    question,
                    top_n: 5,
                    stream: true,
                    doc_name: docVal === "all" ? null : docVal
                }),
                signal: aborter.signal
            });
            if (!res.ok || !res.body) throw new Error("status " + res.status);

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = "";
            const textEl = document.createElement("div");
            let streaming = false;

            for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const parts = buf.split("\n\n");
                buf = parts.pop();
                for (const part of parts) {
                    const line = part.trim();
                    if (!line.startsWith("data:")) continue;
                    const payload = line.slice(5).trim();
                    if (payload === "[DONE]") continue;
                    let ev;
                    try { ev = JSON.parse(payload); } catch (e) { continue; }
                    if (ev.type === "sources") {
                        sources = ev.data || [];
                    } else if (ev.type === "token") {
                        if (!streaming) {
                            streaming = true;
                            typing.replaceWith(textEl);
                            textEl.className = "msg assistant";
                            textEl.innerHTML = '<div class="avatar">D</div><div class="a-body"><div class="a-text"></div></div>';
                        }
                        text += ev.data || "";
                        textEl.querySelector(".a-text").innerHTML = esc(text).replace(/\n/g, "<br>");
                        scrollBottom();
                    }
                }
            }
            if (textEl && textEl.parentNode) textEl.remove();
            else if (typing.parentNode) typing.remove();
        } catch (err) {
            if (err && err.name === "AbortError") {
                if (typing.parentNode) typing.remove();
                if (!text) {
                    showToast("Stopped");
                    setGenerating(false);
                    aborter = null;
                    return;
                }
                showToast("Stopped — partial answer kept");
            } else {
                console.error("chat error:", err);
                if (typing.parentNode) typing.remove();
                // Fallback: non-streaming endpoint (also returns grounding metadata).
                try {
                    const r2 = await fetch("/ask", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ question, top_n: 5, doc_name: docVal === "all" ? null : docVal })
                    });
                    if (!r2.ok) throw new Error("fallback " + r2.status);
                    const d2 = await r2.json();
                    text = d2.raw_text || "";
                    sources = d2.sources || [];
                } catch (e2) {
                    console.error("fallback error:", e2);
                    failed = true;
                }
            }
        }

        const latencyMs = Math.round(performance.now() - t0);
        setGenerating(false);
        aborter = null;

        if (failed || (!text && !sources.length)) {
            const errMsg = { role: "assistant", content: "Request failed — is the model server reachable? Try again.", sources: [], latencyMs, model: "", abstained: true, cite: { cited: 0, ok: 0 } };
            chat.messages.push(errMsg);
            stream.appendChild(assistantNode(errMsg));
            touchChat(chat);
            showToast("Request failed");
            input.focus();
            return;
        }

        const cite = checkCitations(text, sources);
        const abstained = /do not contain information|insufficient|no relevant documents/i.test(text) && cite.cited === 0;
        const msg = {
            role: "assistant", content: text, sources, latencyMs,
            model: "", abstained, cite
        };
        chat.messages.push(msg);
        touchChat(chat);
        renderStream();
        input.focus();
    }

    function regenerate() {
        if (generating) return;
        const c = activeId && getChat(activeId);
        if (!c) return;
        let lastUser = -1, lastAsst = -1;
        c.messages.forEach((m, i) => {
            if (m.role === "user") lastUser = i;
            if (m.role === "assistant") lastAsst = i;
        });
        if (lastUser < 0) return;
        const q = c.messages[lastUser].content;
        if (lastAsst > lastUser) c.messages.splice(lastAsst, 1); // replaced by fresh answer
        renderStream();
        sendQuestionAppend(q);
    }

    async function sendQuestionAppend(question) {
        // Appends a fresh assistant answer without duplicating the user bubble.
        question = (question || "").trim();
        if (!question || generating) return;
        const chat = getChat(activeId);
        if (!chat) return sendQuestion(question);
        if (welcomeHero.parentNode === stream) welcomeHero.style.display = "none";

        const typing = typingNode();
        stream.appendChild(typing);
        scrollBottom(true);
        setGenerating(true);
        aborter = new AbortController();
        const t0 = performance.now();
        const docVal = docSelect.value;
        let sources = [], text = "", failed = false;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question, top_n: 5, stream: true, doc_name: docVal === "all" ? null : docVal }),
                signal: aborter.signal
            });
            if (!res.ok || !res.body) throw new Error("status " + res.status);
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = "";
            for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const parts = buf.split("\n\n");
                buf = parts.pop();
                for (const part of parts) {
                    const line = part.trim();
                    if (!line.startsWith("data:")) continue;
                    const payload = line.slice(5).trim();
                    if (payload === "[DONE]") continue;
                    let ev;
                    try { ev = JSON.parse(payload); } catch (e) { continue; }
                    if (ev.type === "sources") sources = ev.data || [];
                    else if (ev.type === "token") {
                        text += ev.data || "";
                        if (typing.parentNode) {
                            typing.innerHTML = '<div class="avatar">D</div><div class="a-body"><div class="a-text">' +
                                esc(text).replace(/\n/g, "<br>") + "</div></div>";
                        }
                        scrollBottom();
                    }
                }
            }
            if (typing.parentNode) typing.remove();
        } catch (err) {
            if (typing.parentNode) typing.remove();
            if (!(err && err.name === "AbortError") || !text) failed = true;
        }

        const latencyMs = Math.round(performance.now() - t0);
        setGenerating(false);
        aborter = null;

        const cite = checkCitations(text, sources);
        const msg = failed || (!text && !sources.length)
            ? { role: "assistant", content: "Request failed — is the model server reachable? Try again.", sources: [], latencyMs, model: "", abstained: true, cite: { cited: 0, ok: 0 } }
            : {
                role: "assistant", content: text, sources, latencyMs,
                model: "", abstained: false, cite
            };
        chat.messages.push(msg);
        touchChat(chat);
        renderStream();
        input.focus();
    }

    /* ── Events ── */
    function autoresize() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 190) + "px";
    }
    input.addEventListener("input", autoresize);
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
    });
    sendBtn.addEventListener("click", () => {
        if (generating) { stopGeneration(); return; }
        const q = input.value.trim();
        if (q) sendQuestion(q);
    });

    document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); }
        if (e.key === "Escape") { closeMenu(); closeSidebarMobile(); }
    });

    $("newChatBtn").addEventListener("click", newChat);
    $("menuBtn").addEventListener("click", () => {
        if (window.innerWidth <= 820) app.classList.toggle("side-open");
        else app.classList.toggle("side-hidden");
    });
    $("scrim").addEventListener("click", closeSidebarMobile);
    function closeSidebarMobile() { app.classList.remove("side-open"); }

    chatSearch.addEventListener("input", renderList);

    docSelect.value = localStorage.getItem(DOC_KEY) || "all";
    docSelect.addEventListener("change", () => {
        localStorage.setItem(DOC_KEY, docSelect.value);
        showToast(docSelect.value === "all" ? "Searching all documents" : "Scoped to " + docSelect.value);
    });

    $("clearAllBtn").addEventListener("click", () => {
        if (!chats.length) return;
        if (!confirm("Delete all chats?")) return;
        chats = [];
        activeId = null;
        saveChats();
        renderStream();
        renderList();
        showToast("All chats cleared");
    });

    /* ── Init ── */
    loadChats();
    renderStream();
    renderList();
    input.focus();
})();
</script>
</body>
</html>
